<!-- ============================================================
     VisionAid V2 — Activity Log Panel
     Drop this block below your existing camera card in index.html
     ============================================================ -->

<!-- In your <head>, add this font -->
<!-- <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"> -->

<style>
  /* ── Design tokens ─────────────────────────────────────── */
  :root {
    --log-bg:          #0a0c0f;
    --log-surface:     #111318;
    --log-border:      #1e2229;
    --log-border-glow: #2a3040;
    --log-text:        #c8cdd8;
    --log-muted:       #4a5060;
    --log-timestamp:   #3d8aff;

    --safe-color:      #22c55e;
    --safe-bg:         rgba(34,197,94,0.08);
    --warn-color:      #f59e0b;
    --warn-bg:         rgba(245,158,11,0.08);
    --danger-color:    #ef4444;
    --danger-bg:       rgba(239,68,68,0.10);
    --info-color:      #818cf8;
    --info-bg:         rgba(129,140,248,0.08);

    --scrollbar-track: #0d0f13;
    --scrollbar-thumb: #1e2535;
  }

  /* ── Panel wrapper ─────────────────────────────────────── */
  .log-panel {
    width: 100%;
    max-width: 640px;         /* match your camera card width */
    margin: 16px auto 0;
    background: var(--log-bg);
    border: 1px solid var(--log-border);
    border-radius: 16px;
    overflow: hidden;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    box-shadow:
      0 0 0 1px var(--log-border-glow),
      0 24px 48px rgba(0,0,0,0.6);
  }

  /* ── Panel header ──────────────────────────────────────── */
  .log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--log-surface);
    border-bottom: 1px solid var(--log-border);
    user-select: none;
  }

  .log-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .log-header-icon {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--log-timestamp);
    box-shadow: 0 0 8px var(--log-timestamp);
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.8); }
  }

  .log-header-title {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--log-text);
  }

  .log-count-badge {
    font-size: 10px;
    font-weight: 600;
    color: var(--log-muted);
    background: var(--log-border);
    padding: 2px 8px;
    border-radius: 100px;
    letter-spacing: 0.05em;
    transition: color 0.3s;
  }

  .log-clear-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--log-muted);
    background: none;
    border: 1px solid var(--log-border);
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: color 0.2s, border-color 0.2s;
  }

  .log-clear-btn:hover {
    color: var(--danger-color);
    border-color: var(--danger-color);
  }

  /* ── Scroll container ──────────────────────────────────── */
  .log-scroll {
    max-height: 280px;
    overflow-y: auto;
    padding: 8px 0;
    scroll-behavior: smooth;
  }

  .log-scroll::-webkit-scrollbar       { width: 4px; }
  .log-scroll::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  .log-scroll::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 4px;
  }

  /* ── Individual log entry ──────────────────────────────── */
  .log-entry {
    display: grid;
    grid-template-columns: 72px 1fr auto;
    align-items: start;
    gap: 0 12px;
    padding: 9px 18px;
    border-left: 2px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    animation: entry-slide 0.25s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes entry-slide {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .log-entry:hover {
    background: rgba(255,255,255,0.02);
  }

  /* Zone-based accent colors */
  .log-entry.safe   { border-left-color: var(--safe-color);   background: var(--safe-bg); }
  .log-entry.warn   { border-left-color: var(--warn-color);   background: var(--warn-bg); }
  .log-entry.danger { border-left-color: var(--danger-color); background: var(--danger-bg); animation: danger-flash 0.4s ease both, entry-slide 0.25s cubic-bezier(0.16,1,0.3,1) both; }
  .log-entry.info   { border-left-color: var(--info-color);   background: var(--info-bg); }

  @keyframes danger-flash {
    0%  { background: rgba(239,68,68,0.25); }
    100%{ background: var(--danger-bg); }
  }

  /* Timestamp col */
  .log-ts {
    font-size: 10px;
    color: var(--log-timestamp);
    padding-top: 1px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  /* Message col */
  .log-msg {
    font-size: 12px;
    color: var(--log-text);
    line-height: 1.5;
    word-break: break-word;
  }

  .log-msg strong {
    font-weight: 600;
    color: #fff;
  }

  /* Zone pill */
  .log-zone {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 100px;
    white-space: nowrap;
    align-self: start;
  }

  .log-entry.safe   .log-zone { color: var(--safe-color);   background: rgba(34,197,94,0.15);  }
  .log-entry.warn   .log-zone { color: var(--warn-color);   background: rgba(245,158,11,0.15); }
  .log-entry.danger .log-zone { color: var(--danger-color); background: rgba(239,68,68,0.18);  }
  .log-entry.info   .log-zone { color: var(--info-color);   background: rgba(129,140,248,0.15);}

  /* ── Empty state ───────────────────────────────────────── */
  .log-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 40px 20px;
    color: var(--log-muted);
  }

  .log-empty-icon {
    font-size: 24px;
    opacity: 0.4;
  }

  .log-empty-text {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ── Footer ────────────────────────────────────────────── */
  .log-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 18px;
    border-top: 1px solid var(--log-border);
    background: var(--log-surface);
  }

  .log-footer-note {
    font-size: 10px;
    color: var(--log-muted);
    letter-spacing: 0.05em;
  }

  .log-footer-note span {
    color: var(--log-timestamp);
  }
</style>


<!-- ── HTML ─────────────────────────────────────────────── -->
<div class="log-panel" id="log-panel">

  <div class="log-header">
    <div class="log-header-left">
      <div class="log-header-icon"></div>
      <span class="log-header-title">Activity Log</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="log-count-badge" id="log-count">0 / 10</span>
      <button class="log-clear-btn" onclick="VisionLog.clear()">clear</button>
    </div>
  </div>

  <div class="log-scroll" id="log-scroll">
    <div class="log-empty" id="log-empty">
      <div class="log-empty-icon">◎</div>
      <div class="log-empty-text">Awaiting detections</div>
    </div>
  </div>

  <div class="log-footer">
    <span class="log-footer-note">Last <span>10</span> events retained · Camera unaffected</span>
    <span class="log-footer-note" id="log-session-time">Session: 00:00</span>
  </div>
</div>


<!-- ── JS ───────────────────────────────────────────────── -->
<script>
/**
 * VisionLog — Activity log manager for VisionAid V2
 *
 * Usage from anywhere in your codebase:
 *   VisionLog.add('Person detected 1.2m ahead — move right', 'danger')
 *   VisionLog.add('Path clear', 'safe')
 *   VisionLog.add('Model loaded', 'info')
 *
 * Zones: 'safe' | 'warn' | 'danger' | 'info'
 */
const VisionLog = (() => {
  const MAX_LOGS    = 10;
  const entries     = [];          // circular buffer
  const scrollEl    = document.getElementById('log-scroll');
  const countEl     = document.getElementById('log-count');
  const emptyEl     = document.getElementById('log-empty');
  const sessionEl   = document.getElementById('log-session-time');

  // ── Session timer ──────────────────────────────────────
  const sessionStart = Date.now();
  setInterval(() => {
    const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const ss = String(elapsed % 60).padStart(2, '0');
    sessionEl.textContent = `Session: ${mm}:${ss}`;
  }, 1000);

  // ── Helpers ────────────────────────────────────────────
  function timestamp() {
    return new Date().toLocaleTimeString('en-IN', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
  }

  function zoneLabel(zone) {
    const labels = { safe: 'Safe', warn: 'Warn', danger: 'Danger', info: 'Info' };
    return labels[zone] || 'Info';
  }

  function updateCount() {
    countEl.textContent = `${entries.length} / ${MAX_LOGS}`;
  }

  function renderEntry(entry) {
    const el = document.createElement('div');
    el.className = `log-entry ${entry.zone}`;
    el.dataset.id = entry.id;

    // Bold the first noun phrase (object class if present)
    const formattedMsg = entry.message.replace(
      /^([A-Z][a-z]+)/,
      '<strong>$1</strong>'
    );

    el.innerHTML = `
      <span class="log-ts">${entry.ts}</span>
      <span class="log-msg">${formattedMsg}</span>
      <span class="log-zone">${zoneLabel(entry.zone)}</span>
    `;
    return el;
  }

  // ── Public API ─────────────────────────────────────────
  function add(message, zone = 'info') {
    // Remove oldest if at cap
    if (entries.length >= MAX_LOGS) {
      const oldest = entries.shift();
      const oldEl = scrollEl.querySelector(`[data-id="${oldest.id}"]`);
      if (oldEl) {
        // Fade out then remove — no abrupt deletion
        oldEl.style.transition = 'opacity 0.3s, transform 0.3s';
        oldEl.style.opacity    = '0';
        oldEl.style.transform  = 'translateX(-8px)';
        setTimeout(() => oldEl.remove(), 300);
      }
    }

    const entry = {
      id:      Date.now() + Math.random(),
      ts:      timestamp(),
      message,
      zone
    };
    entries.push(entry);

    // Hide empty state
    if (emptyEl) emptyEl.style.display = 'none';

    // Append DOM entry
    const el = renderEntry(entry);
    scrollEl.appendChild(el);

    // Auto-scroll to latest
    requestAnimationFrame(() => {
      scrollEl.scrollTop = scrollEl.scrollHeight;
    });

    updateCount();
  }

  function clear() {
    entries.length = 0;
    // Animate all out
    [...scrollEl.querySelectorAll('.log-entry')].forEach((el, i) => {
      setTimeout(() => {
        el.style.transition = 'opacity 0.2s, transform 0.2s';
        el.style.opacity    = '0';
        el.style.transform  = 'translateX(-8px)';
        setTimeout(() => el.remove(), 200);
      }, i * 30);
    });
    setTimeout(() => {
      if (emptyEl) emptyEl.style.display = 'flex';
    }, entries.length * 30 + 250);
    updateCount();
  }

  return { add, clear };
})();


// ── Integration examples — wire these into your existing modules ──────────
//
// In audio-guide.js, after TTS fires:
//   VisionLog.add(`${objectClass} detected ${distance}m — ${dodgeInstruction}`, 'danger')
//
// In fusion-logic.js, on zone change:
//   VisionLog.add(`Zone changed to ${newZone}`, newZone)
//
// In object-detector.js, on model load:
//   VisionLog.add('COCO-SSD model loaded', 'info')
//
// In depth-engine.js, on model load:
//   VisionLog.add('Depth-Anything V2 loaded', 'info')
</script>
