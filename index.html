<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VisionAid - Advanced Camera Interface">
    <title>VisionAid Camera Interface</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <main class="main-container">
        <div class="camera-box">
            <div class="camera-header">
                <div class="status-indicator"></div>
                <h1>Live Feed</h1>
            </div>
            <div class="video-wrapper">
                <video id="camera-feed" autoplay playsinline muted></video>

                <!-- Distance Zone Indicator -->
                <div id="zone-indicator" class="zone-indicator">
                    <div class="zone-icon"></div>
                    <div class="zone-text">Initializing...</div>
                </div>

                <!-- Debug: Depth Map Visualization -->
                <canvas id="depth-canvas" class="depth-canvas hidden"></canvas>

                <div id="camera-error" class="error-message hidden">
                    <p>Camera access denied or unavailable</p>
                    <button id="retry-btn">Retry Access</button>
                </div>
                <div id="loading-spinner" class="spinner"></div>
            </div>
            <div class="camera-controls">
                <!-- Placeholder for future controls -->
                <button id="switch-camera-btn" class="control-btn" aria-label="Switch Camera">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8H2l5 6 5-6H9c0-3.314 2.686-6 6-6s6 2.686 6 6-2.686 6-6 6c-1.284 0-2.478-.41-3.473-1.1L10.1 22.25C11.306 23.35 12.894 24 14.667 24c5.14 0 9.333-4.477 9.333-10h-4z">
                        </path>
                    </svg>
                </button>
                <button id="toggle-camera-btn" class="control-btn active" aria-label="Start/Stop Guiding Model">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                        </path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </button>
            </div>

            <!-- Status Display -->
            <div id="status-display" class="status-display">
                <div class="status-item">
                    <span class="status-label">System:</span>
                    <span id="system-status" class="status-value">Loading...</span>
                </div>
                <div class="status-item">
                    <span class="status-label">FPS:</span>
                    <span id="fps-display" class="status-value">--</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Audio:</span>
                    <span id="audio-status" class="status-value">Inactive</span>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="script.js"></script>
</body>

</html>
